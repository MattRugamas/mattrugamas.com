<header>
  <a id="skipToMainContent" href="#mainContent">Skip to Main Content</a>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-home" aria-label="Home">MR</a>
      <ul>
        <span class="nav-indicator" aria-hidden="true"></span>
        {% for item in site.data.navigation %}
        <li{% if item.link == '/' %} class="nav-item-home"{% endif %}>
          <a href="{{ item.link }}" class="
            {%- if page.url == item.link -%}
              current
            {%- else -%}
              not-current
            {%- endif -%}
          ">{{ item.name }}</a>
        </li>
        {%- endfor -%}
        {%- if page.layout == 'post' -%}
        <li>
          <a href="/" class="current">Blog</a>
        </li>
        {%- endif -%}
      </ul>
      <div class="nav-actions">
        <a href="/feed.xml" id="rss-link" aria-label="RSS Feed">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11a9 9 0 0 1 9 9" />
            <path d="M4 4a16 16 0 0 1 16 16" />
            <circle cx="5" cy="19" r="1.25" />
          </svg>
        </a>
        {% include theme-toggle.html %}
      </div>
    </div>
  </nav>
</header>
