title: Matt Rugamas
tagline: Customers, product, and code
description: >
  Personal site of Matt Rugamas, a support engineer in Los Angeles
  working at the intersection of customers, product, and code.
url: https://mattrugamas.com
permalink: /:title

# SASS/SCSS
sass:
  style: compressed

# Google Analytics
google_analytics: G-EC57RQ9MNY

# Social
twitter:
  card: summary_large_image
github_username: MattRugamas

# Feature flags
#
# tags — tagging is built and working but hidden for now; there is not enough
# writing here yet for filtering to earn its place. Nothing was deleted: posts
# keep their `tags:` front matter, _data/tags.yml keeps the canonical list, and
# the includes, tag layout and _sass/_tags.scss all stay in the build.
#
# To bring tagging back, do both:
#   1. set `tags: true` below
#   2. remove `- tags` from the `exclude:` list further down, which is what
#      keeps the /tags/<tag>/ archive pages out of the site and the sitemap
features:
  tags: false

# Build settings
repository: MattRugamas/mattrugamas.com
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - rouge
  - jekyll-tidy
  - jekyll-figure
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Plugin Settings
jekyll-figure:
  paragraphs: false

# Files Jekyll should not copy into the built site
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - docs
  - .github
  - .agents
  - skills-lock.json
  - assets/favicon-source.svg
  # Paired with `features.tags` above — remove this line to restore the
  # /tags/<tag>/ archive pages.
  - tags

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "tags"
      type: "pages"
    values:
      layout: "tag"
  - scope:
      path: ""
    values:
      layout: "default"
      # Default social share card (Open Graph / Twitter); pages may override.
      image:
        path: /assets/img/site/social-card.png
        width: 1200
        height: 630
